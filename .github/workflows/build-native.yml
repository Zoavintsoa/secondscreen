name: Build native SecondScreen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MsQuic
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg.exe" install
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows host
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          & $msbuild native/windows-host/SecondScreenHost/SecondScreenHost.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:VcpkgRoot="$env:VCPKG_ROOT"

  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build Android
        working-directory: clients/android
        run: gradle assembleDebug

  apple-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build macOS host
        run: |
          xcodebuild -project native/macos-host/SecondScreenMacHost.xcodeproj -target SecondScreenMacHost -configuration Release -sdk macosx CODE_SIGNING_ALLOWED=NO build
      - name: Build iPadOS client
        run: |
          xcodebuild -project clients/ipados/SecondScreenIPad.xcodeproj -target SecondScreenIPad -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
