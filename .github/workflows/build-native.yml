name: Build native SecondScreen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows host
        shell: pwsh
        run: |
          msbuild native/windows-host/SecondScreenHost/SecondScreenHost.vcxproj /p:Configuration=Release /p:Platform=x64

  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build Android
        working-directory: clients/android
        run: gradle assembleDebug

  apple-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build macOS host
        run: |
          xcodebuild             -project native/macos-host/SecondScreenMacHost.xcodeproj             -target SecondScreenMacHost             -configuration Release             -sdk macosx             CODE_SIGNING_ALLOWED=NO             build
      - name: Build iPadOS client
        run: |
          xcodebuild             -project clients/ipados/SecondScreenIPad.xcodeproj             -target SecondScreenIPad             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             build
