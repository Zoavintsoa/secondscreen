name: Build native SecondScreen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows host
        shell: pwsh
        run: |
          msbuild native/windows-host/SecondScreenHost/SecondScreenHost.vcxproj /p:Configuration=Release /p:Platform=x64

  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build Android
        working-directory: clients/android
        run: gradle assembleDebug

  apple-preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple build toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          xcodebuild -showsdks
      - name: Verify Apple source layout
        shell: bash
        run: |
          test -f native/macos-host/README.md
          test -f clients/ipados/README.md
          echo "Apple Xcode targets are reserved until their native projects are added."

  apple-build:
    if: ${{ hashFiles('native/macos-host/**/*.xcodeproj/**', 'native/macos-host/**/*.xcworkspace/**', 'clients/ipados/**/*.xcodeproj/**', 'clients/ipados/**/*.xcworkspace/**') != '' }}
    runs-on: macos-latest
    needs: apple-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple targets
        shell: bash
        run: |
          set -e
          find native/macos-host clients/ipados -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print
          echo "Native Apple projects will be built here once present."
