name: Build native SecondScreen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MsQuic
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg.exe" install
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows host
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          & $msbuild native/windows-host/SecondScreenHost/SecondScreenHost.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:VcpkgRoot="$env:VCPKG_ROOT" /p:VcpkgInstalledDir="$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows\"
      - name: Package Windows host
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\artifacts\windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\native\windows-host" -Filter SecondScreenHost.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "SecondScreenHost.exe not found" }
          Copy-Item $exe.FullName "$out\SecondScreenHost.exe"
          Compress-Archive -Path "$out\SecondScreenHost.exe" -DestinationPath "$env:GITHUB_WORKSPACE\SecondScreen-Windows.zip" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-Windows
          path: SecondScreen-Windows.zip
          if-no-files-found: error

  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build Android
        working-directory: clients/android
        run: gradle assembleDebug
      - name: Package Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/android"
          APK="$(find "$GITHUB_WORKSPACE/clients/android/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/android/SecondScreen-Android.apk"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-Android
          path: artifacts/android/SecondScreen-Android.apk
          if-no-files-found: error

  apple-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build macOS host
        run: |
          xcodebuild -project native/macos-host/SecondScreenMacHost.xcodeproj -target SecondScreenMacHost -configuration Release -sdk macosx CODE_SIGNING_ALLOWED=NO build
      - name: Package macOS host
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE" -type d -path '*/build/Release/SecondScreenMacHost.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/SecondScreen-macOS.zip"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-macOS
          path: SecondScreen-macOS.zip
          if-no-files-found: error
      - name: Build iPadOS client
        run: |
          xcodebuild -project clients/ipados/SecondScreenIPad.xcodeproj -target SecondScreenIPad -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Package iPadOS client
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE" -type d -path '*/build/Debug-iphoneos/SecondScreenIPad.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/SecondScreen-iPadOS.zip"
      - name: Upload iPadOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-iPadOS
          path: SecondScreen-iPadOS.zip
          if-no-files-found: error

  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure portable protocol tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build portable protocol tests
        run: cmake --build build --parallel 2
      - name: Run portable protocol tests
        run: ctest --test-dir build --output-on-failure
